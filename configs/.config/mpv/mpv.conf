##################
# General / UI   #
##################

# Don't close the player window after the video finishes playing
#keep-open=yes 

# Save the current playback position when quitting the player
save-position-on-quit=yes

# Start the window at a maximum of 90% of your screen size
#autofit-larger=90%x90%

# Hide the cursor after 1000ms of inactivity
cursor-autohide=1000

# Force the video to be seekable, even if the file reports it isn't
force-seekable=yes

# Make the on-screen controller (OSD) disappear faster (in milliseconds)
osd-duration=1500

##################
# Video Quality  #
##################

# Load a built-in profile that uses high-quality rendering settings
# Note: This requires a reasonably modern GPU. If it lags, remove this line.
#profile=high-quality

# The video output driver. 'gpu-next' is the modern, highly recommended renderer. 
# If you experience issues, fall back to vo=gpu.
#vo=gpu-next

# Enable hardware decoding for supported formats. 'auto-safe' is usually best. 
# For specific GPUs, you can try: d3d11va (Windows), vaapi (Linux), or nvdec (Nvidia).
#hwdec=auto-safe

# Sync the video to your monitor's refresh rate to prevent screen tearing/judder
#video-sync=display-resample

##################
# Audio          #
##################

volume=75
# Set maximum volume limit to 130% (useful for quiet movies)
volume-max=130

# Automatically select audio track languages based on priority (highest to lowest)
#alang=jpn,jp,eng,en

##################
# Subtitles      #
##################

# Automatically select subtitle track languages based on priority
slang=eng,en

# Force subtitles to render at the video's resolution (better for stylized anime subs)
blend-subtitles=yes

# Adjust the subtitle font style if the video doesn't specify one
sub-font='Arial'
sub-font-size=40
sub-border-size=2
sub-color='#FFFFFF'
sub-shadow-color='#000000'
sub-shadow-offset=2

##################
# Screenshots    #
##################

# Save screenshots as high-quality PNGs
screenshot-directory=~/Pictures/mpv
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=7

# Define the screenshot file naming template (VideoName - [00:15:30.123] (1).png)
screenshot-template="%F - [%P] (%#01n)"

# --- Audio ---

# --- OSD ---
osd-on-seek=msg-bar
osd-bar-align-y=0.9
osd-font-size=28

