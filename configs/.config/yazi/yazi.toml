[[plugin.prepend_previewers]]
url = "*.{zip,ZIP}"
run = "ouch"

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

[opener]
extract = [
    { run = 'ouch d -y %s', desc = "Extract here with ouch", for = "unix" },
]

[open]
prepend_rules = [
    { url = "*.zip", use = "extract" },
]


